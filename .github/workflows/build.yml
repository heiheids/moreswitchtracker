name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  neoforge-1-21-1:
    name: NeoForge 1.21.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: moreswitchtracker-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error

  fabric-26-3:
    name: Fabric 26.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: versions/26.3-fabric
        run: chmod +x gradlew && ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: moreswitchtracker-fabric-26.3
          path: versions/26.3-fabric/build/libs/*.jar
          if-no-files-found: error

  neoforge-26-3:
    name: NeoForge 26.3
    runs-on: ubuntu-latest
    # The NeoForge 26.3 toolchain is sensitive to the JDK and to the state of
    # createMinecraftArtifacts; see "Building from source" in README.md for the
    # javac fallback used to produce the release jar. Keep this job non-blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: versions/26.3-neoforge
        run: chmod +x gradlew && ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: moreswitchtracker-neoforge-26.3
          path: versions/26.3-neoforge/build/libs/*.jar
          if-no-files-found: warn
